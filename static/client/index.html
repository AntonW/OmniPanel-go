<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Omnipanel</title>
    <script src="/client/client.js"></script>
    <style>
        :root {
            font-size: 100%;
        }

        html {
            font-size: 100%;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            touch-action: pan-x pan-y;
        }

        html * {
            font-weight: 700;
        }

        body {
            background-color: var(--workspace-bg, #fff);
            touch-action: none;
            overscroll-behavior: none;
        }

        .fullscreen-toggle {
            position: fixed;
            top: 2vmin;
            right: 2vmin;
            z-index: 9999;
            background: rgba(0, 40, 60, 0.7);
            color: var(--primary-color);
            border: 1px solid var(--primary-color);
            padding: 1vmin 2vmin;
            font-size: clamp(0.7rem, 2vmin, 1rem);
            border-radius: 4px;
            backdrop-filter: blur(5px);
        }

        #fullscreen-prompt {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            color: white;
            font-family: sans-serif;
            backdrop-filter: blur(5px);
        }

        .prompt-card {
            background: #222;
            padding: 2rem;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid #444;
        }

        .prompt-card button {
            margin-top: 1.5rem;
            padding: 12px 24px;
            font-size: 1.1rem;
            background: #0cf574;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .prompt-card button:hover {
            background: #0056b3;
        }

        .command-toast {
            position: fixed;
            bottom: 2vmin;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(20, 25, 30, 0.95);
            border: 1px solid #444;
            border-radius: 8px;
            padding: 1vmin 2vmin;
            max-width: 80vw;
            max-height: 40vh;
            z-index: 10001;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            cursor: pointer;
            transition: opacity 0.3s ease;
        }

        .command-toast.success {
            border-color: #0cf574;
        }

        .command-toast.error {
            border-color: #f54242;
        }

        .command-toast.fading {
            opacity: 0;
        }

        .toast-header {
            font-size: clamp(0.7rem, 1.5vmin, 0.9rem);
            font-weight: 700;
            margin-bottom: 0.5vmin;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .command-toast.success .toast-header {
            color: #0cf574;
        }

        .command-toast.error .toast-header {
            color: #f54242;
        }

        .toast-body {
            font-size: clamp(0.6rem, 1.2vmin, 0.8rem);
            color: #ccc;
            margin: 0;
            padding: 0;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 30vh;
            overflow-y: auto;
            font-family: 'Consolas', 'Monaco', monospace;
        }

        .mic-btn {
            position: fixed;
            bottom: 3vmin;
            right: 3vmin;
            z-index: 9998;
            width: clamp(50px, 8vmin, 70px);
            height: clamp(50px, 8vmin, 70px);
            border-radius: 50%;
            background: rgba(0, 40, 60, 0.8);
            color: #8ba4b8;
            border: 2px solid #8ba4b8;
            font-size: clamp(1.5rem, 3vmin, 2rem);
            cursor: pointer;
            backdrop-filter: blur(5px);
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .mic-btn:hover {
            background: rgba(0, 60, 80, 0.9);
            transform: scale(1.05);
        }

        .mic-btn.recording {
            background: rgba(245, 66, 66, 0.8);
            border-color: #f54242;
            color: white;
            animation: pulse-recording 1s infinite;
        }

        .mic-btn.processing {
            background: rgba(245, 165, 66, 0.8);
            border-color: #f5a542;
            color: white;
            animation: pulse-processing 0.5s infinite;
        }

        .mic-btn.wake-listening {
            background: rgba(28, 202, 216, 0.6);
            border-color: #1ccad8;
            color: white;
            animation: pulse-wake 2s infinite;
        }

        .mic-btn.wake-detected {
            background: rgba(28, 202, 216, 0.9);
            border-color: #1ccad8;
            color: white;
            animation: pulse-wake-detected 0.3s infinite;
        }

        @keyframes pulse-recording {
            0%, 100% { box-shadow: 0 0 0 0 rgba(245, 66, 66, 0.5); }
            50% { box-shadow: 0 0 0 15px rgba(245, 66, 66, 0); }
        }

        @keyframes pulse-processing {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        @keyframes pulse-wake {
            0%, 100% { box-shadow: 0 0 0 0 rgba(28, 202, 216, 0.4); }
            50% { box-shadow: 0 0 0 10px rgba(28, 202, 216, 0); }
        }

        @keyframes pulse-wake-detected {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .speech-toast {
            position: fixed;
            bottom: 12vmin;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(20, 25, 30, 0.95);
            border: 1px solid #444;
            border-radius: 8px;
            padding: 1.5vmin 3vmin;
            max-width: 70vw;
            z-index: 10001;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            cursor: pointer;
            transition: opacity 0.3s ease;
            font-size: clamp(0.7rem, 1.5vmin, 0.9rem);
            color: #ccc;
            text-align: center;
        }

        .speech-toast.success {
            border-color: #0cf574;
            color: #0cf574;
        }

        .speech-toast.error {
            border-color: #f54242;
            color: #f54242;
        }

        .speech-toast.fading {
            opacity: 0;
        }

        .loaded-block.speech-flash {
            animation: speech-flash-anim 0.5s ease;
        }

        @keyframes speech-flash-anim {
            0% { box-shadow: 0 0 0 0 rgba(28, 202, 216, 0.7); }
            50% { box-shadow: 0 0 20px 5px rgba(28, 202, 216, 0.5); }
            100% { box-shadow: 0 0 0 0 rgba(28, 202, 216, 0); }
        }

        #swipe-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 99999;
            pointer-events: none;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(3px);
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        #swipe-overlay.swipe-left {
            opacity: 1;
            animation: swipeLeftAnim 0.3s ease;
        }

        #swipe-overlay.swipe-right {
            opacity: 1;
            animation: swipeRightAnim 0.3s ease;
        }

        @keyframes swipeLeftAnim {
            0% { transform: translateX(100%); opacity: 0; }
            100% { transform: translateX(0); opacity: 1; }
        }

        @keyframes swipeRightAnim {
            0% { transform: translateX(-100%); opacity: 0; }
            100% { transform: translateX(0); opacity: 1; }
        }

        .swipe-panel-name {
            background: rgba(20, 25, 30, 0.95);
            border: 2px solid #0cf574;
            border-radius: 12px;
            padding: 2vmin 4vmin;
            font-size: clamp(1.2rem, 3vmin, 2rem);
            color: #0cf574;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
        }

        #swipe-toast {
            position: fixed;
            bottom: 3vmin;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(20, 25, 30, 0.95);
            border: 1px solid #444;
            border-radius: 8px;
            padding: 1.5vmin 3vmin;
            max-width: 70vw;
            z-index: 100000;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            font-size: clamp(0.8rem, 1.5vmin, 1rem);
            color: #ccc;
            text-align: center;
            opacity: 0;
            transition: all 0.3s ease;
        }

        #swipe-toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        #swipe-toast.toast-error {
            border-color: #f54242;
            color: #f54242;
        }

        #swipe-toast.toast-info {
            border-color: #1ccad8;
            color: #1ccad8;
        }
    </style>
</head>

<body style="overflow: hidden;">
    <h1>Something went wrong</h1>
    <p>Panel is not loaded...</p>
</body>

</html>
