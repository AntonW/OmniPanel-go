<!--
    OmniPanel Login Page

    Provides a token entry form when authentication is enabled on the relay server.
    This page is served at /login and is exempt from auth middleware, so it is always
    accessible. After successful token validation against /api/config, the token is
    stored in localStorage (if "Remember token" is checked) or sessionStorage (one-time),
    and the user is redirected to the original page with the token appended as a query parameter.

    Token storage:
    - localStorage: persists across browser sessions (checked "Remember token")
    - sessionStorage: cleared when the tab is closed (unchecked "Remember token")

    The token is then picked up by getAuthToken() in each page's JavaScript, which checks
    URL params first, then localStorage, then sessionStorage.
-->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniPanel - Login</title>
    <!-- Favicon: SVG logo for browser tab icon. Also served via /favicon.ico redirect in relay server. -->
    <link rel="icon" href="/omnipanel-go-logo.svg" type="image/svg+xml">
    <style>
        /* Theme variables - dark mode only (login page has no theme toggle) */
        :root {
            --bg-primary: #0d1117;
            --bg-secondary: #161b22;
            --bg-card: #161b22;
            --bg-input: #0d1117;
            --text-primary: #e6edf3;
            --text-secondary: #8b949e;
            --accent: #0cf574;
            --accent-hover: #0bd666;
            --border: #30363d;
            --shadow: rgba(0, 0, 0, 0.3);
            --radius: 12px;
            --radius-sm: 6px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            width: 100%;
            max-width: 400px;
            padding: 2rem;
        }

        .login-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 2.5rem;
            box-shadow: 0 8px 24px var(--shadow);
        }

        .logo {
            text-align: center;
            margin-bottom: 2rem;
        }

        .logo h1 {
            font-size: 1.75rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent), #00b4d8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .logo p {
            color: var(--text-secondary);
            font-size: 0.875rem;
            margin-top: 0.5rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
        }

        /* Checkbox label: flex alignment keeps checkbox and text on one line */
        .form-group label:has(input[type="checkbox"]) {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
            width: fit-content;
            white-space: nowrap;
        }

        /* Remove default checkbox margin for tight alignment */
        .form-group label:has(input[type="checkbox"]) input[type="checkbox"] {
            margin: 0;
        }

        .form-group input {
            width: 100%;
            padding: 0.75rem 1rem;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-size: 1rem;
            transition: border-color 0.2s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .form-group input::placeholder {
            color: var(--text-secondary);
        }

        .btn-submit {
            width: 100%;
            padding: 0.75rem;
            background: var(--accent);
            color: #0d1117;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .btn-submit:hover {
            background: var(--accent-hover);
        }

        .btn-submit:active {
            transform: scale(0.98);
        }

        .error-message {
            color: #f54242;
            font-size: 0.875rem;
            margin-top: 1rem;
            text-align: center;
            display: none;
        }

        .error-message.visible {
            display: block;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 1rem;
            }

            .login-card {
                padding: 1.5rem;
            }
        }
    </style>
</head>

<body>
    <div class="login-container">
        <div class="login-card">
            <div class="logo">
                <h1>OmniPanel</h1>
                <p>Enter your authentication token to continue</p>
            </div>

            <form id="login-form">
                <div class="form-group">
                    <label for="token-input">Token</label>
                    <input type="password" id="token-input" name="token" placeholder="Enter your token" required
                        autocomplete="off">
                </div>

                <div class="form-group">
                    <label>
                        <input type="checkbox" id="remember-token"> Remember token
                    </label>
                </div>

                <button type="submit" class="btn-submit">Login</button>

                <div id="error-message" class="error-message"></div>
            </form>
        </div>
    </div>

    <script>
        /**
         * Login page script - handles token entry, validation, and storage.
         *
         * Flow:
         * 1. Check for previously saved token in localStorage (pre-fill form)
         * 2. On submit, validate token by calling /api/config with Bearer header
         * 3. If valid, store token in localStorage or sessionStorage based on checkbox
         * 4. Redirect to original page with token as URL query parameter
         */

        const form = document.getElementById('login-form');
        const tokenInput = document.getElementById('token-input');
        const rememberCheckbox = document.getElementById('remember-token');
        const errorMessage = document.getElementById('error-message');

        // Read redirect URL from query param (set by pages that detected missing auth)
        const urlParams = new URLSearchParams(window.location.search);
        const redirectUrl = urlParams.get('redirect') || '/';

        // Pre-fill if a token was previously saved with "Remember"
        const savedToken = localStorage.getItem('auth_token');
        if (savedToken) {
            tokenInput.value = savedToken;
            rememberCheckbox.checked = true;
        }

        /**
         * Validates a token by making an authenticated request to /api/config.
         * Returns true if the server responds with 200 OK.
         * @param {string} token - The token to validate
         * @returns {Promise<boolean>} True if token is valid
         */
        async function validateToken(token) {
            try {
                const res = await fetch('/api/config', {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                return res.ok;
            } catch {
                return false;
            }
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const token = tokenInput.value.trim();

            if (!token) {
                errorMessage.textContent = 'Please enter a token';
                errorMessage.classList.add('visible');
                return;
            }

            const isValid = await validateToken(token);

            if (!isValid) {
                errorMessage.textContent = 'Invalid token. Please try again.';
                errorMessage.classList.add('visible');
                return;
            }

            // Store token: localStorage (persistent) or sessionStorage (tab-only)
            if (rememberCheckbox.checked) {
                localStorage.setItem('auth_token', token);
            } else {
                sessionStorage.setItem('auth_token', token);
                localStorage.removeItem('auth_token');
            }

            // Redirect with token in URL so all pages can pick it up via URL params
            window.location.href = redirectUrl + (redirectUrl.includes('?') ? '&' : '?') + 'token=' + encodeURIComponent(token);
        });

        tokenInput.addEventListener('input', () => {
            errorMessage.classList.remove('visible');
        });

        tokenInput.focus();
    </script>
</body>

</html>
