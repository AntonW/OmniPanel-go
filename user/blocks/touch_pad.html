<settings 
    joystick="0"
    type-joystick="number"
    min-joystick="0"
    max-joystick="9"
    slider="0"
    type-slider="number"
    min-slider="0"
    max-slider="7"
    type-color="color"
    color="#0cf574"
    type-travel="text"
    travel="60px"
    type-safe_zone="text"
    safe_zone="30px"
    border_color="#1ccad8ff"
    type-border_color="color"
></settings>

<div class="joy-container" style="--joy-color: settings-color; --joy-travel: settings-travel; --joy-safe-zone: settings-safe_zone;">
    <div class="joy-hitbox">
        <div class="joy-base">
            <div class="joy-thumb"></div>
        </div>
    </div>
</div>
