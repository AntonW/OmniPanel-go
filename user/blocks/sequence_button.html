<!--
    Sequence Button Block — sends a sequence of keyboard key presses while holding CTRL.
    Designed for games that use CTRL+WASD directional inputs.
    
    Structure: <settings> tag defines configurable properties with types and constraints.
    The HTML uses settings-<key> placeholders replaced at render time with actual values.
    CSS variables are set inline and consumed by theme CSS files.
    
    Settings:
    - icon_url: Path/URL to button icon image (relative to /assets/ or full URL)
    - label: Button text
    - layout: Display mode - "image-only", "text-only", "image-text"
    - text_position: When using image-text layout - "bottom", "top", "left", "right"
    - sequence_code: Comma-separated key sequence using w,a,s,d (e.g., "d,d,w,s,a")
                     Keys are pressed while CTRL is held down.
    - key_delay: Pause between key presses in milliseconds (default: 100)
    - keyboard_index: Virtual keyboard index (0-9)
    - font_size, width, height: Visual styling
    - button_color, button_color_active, label_color, border_color: Theme-aware colors
-->
<settings 
    icon_url=""
    type-icon_url="text"
    label="Sequence"
    type-label="text"
    layout="image-text"
    type-layout="select"
    options-layout="image-only,text-only,image-text"
    text_position="bottom"
    type-text_position="select"
    options-text_position="bottom,top,left,right"
    sequence_code="d,d,w,s,a"
    type-sequence_code="text"
    key_delay="100"
    type-key_delay="number"
    min-key_delay="50"
    max-key_delay="1000"
    keyboard_index="0"
    type-keyboard_index="number"
    min-keyboard_index="0"
    max-keyboard_index="9"
    font_size="12"
    type-font_size="number"
    min-font_size="1"
    width="80%"
    type-width="percentage"
    min-width="10"
    max-width="100"
    height="80%"
    type-height="percentage"
    min-height="10"
    max-height="100"
    button_color="#1a1a0eff"
    type-button_color="color"
    button_color_active="#FFD700ff"
    type-button_color_active="color"
    label_color="#FFD700ff"
    type-label_color="color"
    border_color="#FFD700ff"
    type-border_color="color"
></settings>

<div class="sequence-button" style="--font-size: settings-font_size; --width: settings-width; --height: settings-height; --button-color: settings-button_color; --label-color: settings-label_color; --button-color-active: settings-button_color_active; --border-color: settings-border_color;">
    <button 
        data-sequence-code="settings-sequence_code" 
        data-key-delay="settings-key_delay" 
        data-keyboard-index="settings-keyboard_index"
        data-layout="settings-layout"
        data-text-position="settings-text_position"
    >
        <div class="btn-content layout-settings-layout text-settings-text_position">
            <img class="btn-icon" data-icon-url="settings-icon_url" alt="" style="display: none;" />
            <span class="btn-label">settings-label</span>
        </div>
    </button>
</div>
