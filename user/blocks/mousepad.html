<settings 
    mousepad="0"
    type-mousepad="number"
    min-mousepad="0"
    max-mousepad="9"
    sensitivity="5"
    type-sensitivity="number"
    min-sensitivity="1"
    max-sensitivity="20"
    type-color="color"
    color="#0cf574"
    label="Mousepad"
    type-label="text"
    font_size="12"
    type-font_size="number"
    min-font_size="1"
></settings>

<div class="mousepad-container" style="--mousepad-color: settings-color; --font-size: settings-font_size;">
    <div class="mousepad-hitbox">
        <span class="mousepad-label">settings-label</span>
        <div class="mousepad-cursor"></div>
    </div>
    <div class="mousepad-buttons">
        <button class="mousepad-btn left" data-btn="left">L</button>
        <button class="mousepad-btn right" data-btn="right">R</button>
    </div>
</div>
