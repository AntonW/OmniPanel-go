<settings 
    label="FLIGHT READY"
    type-label="text"
    font_size="14"
    type-font_size="number"
    min-font_size="1"
    width="90%"
    type-width="percentage"
    min-width="10"
    max-width="100"
    height="60%"
    type-height="percentage"
    min-height="10"
    max-height="100"
    status_color="#1ccad8ff"
    type-status_color="color"
    status_color_active="#ffffffff"
    type-status_color_active="color"
    label_color="#8ba4b8ff"
    type-label_color="color"
    border_color="#1ccad8ff"
    type-border_color="color"
    background_color="#1a2636ff"
    type-background_color="color"
></settings>

<div class="status-indicator" style="--font-size: settings-font_size; --width: settings-width; --height: settings-height; --status-color: settings-status_color; --label-color: settings-label_color; --status-color-active: settings-status_color_active; --border-color: settings-border_color; --background-color: settings-background_color;">
    <div class="status-box">
        <p>settings-label</p>
    </div>
</div>
