<settings 
    title="CPU USAGE"
    type-title="text"
    data_key="cpu_usage"
    type-data_key="text"
    unit="%"
    type-unit="text"
    decimal_places="1"
    type-decimal_places="number"
    min-decimal_places="0"
    max-decimal_places="3"
    font_size="14"
    type-font_size="number"
    min-font_size="1"
    width="90%"
    type-width="percentage"
    min-width="10"
    max-width="100"
    height="60%"
    type-height="percentage"
    min-height="10"
    max-height="100"
    title_color="#8ba4b8ff"
    type-title_color="color"
    value_color="#1ccad8ff"
    type-value_color="color"
    border_color="#1ccad8ff"
    type-border_color="color"
    bg_color="#1a2636ff"
    type-bg_color="color"
></settings>

<div class="data-display" data-key="settings-data_key" style="--font-size: settings-font_size; --width: settings-width; --height: settings-height; --title-color: settings-title_color; --value-color: settings-value_color; --border-color: settings-border_color; --bg-color: settings-bg_color;">
    <div class="data-box">
        <span class="data-title">settings-title</span>
        <div class="data-value-container">
            <span class="data-value">--</span>
            <span class="data-unit">settings-unit</span>
        </div>
    </div>
</div>
