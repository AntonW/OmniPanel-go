<settings 
    label="Push to Talk"
    type-label="text"
    font_size="14"
    type-font_size="number"
    min-font_size="1"
    width="80%"
    type-width="percentage"
    min-width="10"
    max-width="100"
    height="80%"
    type-height="percentage"
    min-height="10"
    max-height="100"
    border_radius="8"
    type-border_radius="number"
    min-border_radius="0"
    max-border_radius="100"
    button_color="#2a3a4aff"
    type-button_color="color"
    button_color_active="#1ccad8ff"
    type-button_color_active="color"
    label_color="#8ba4b8ff"
    type-label_color="color"
    icon_color="#1ccad8ff"
    type-icon_color="color"
></settings>

<div class="ptt-button" data-ptt="true" style="--font-size: settings-font_size; --button-color: settings-button_color; --button-color-active: settings-button_color_active; --label-color: settings-label_color; --icon-color: settings-icon_color; --border-radius: settings-border_radius;">
    <div class="ptt-icon">&#x1F3A4;</div>
    <div class="ptt-label">settings-label</div>
</div>
