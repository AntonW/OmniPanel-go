name: Release Build

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go 1.26
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Install Vosk library (Linux)
        run: |
          VOSK_LIB_VERSION="0.3.45"
          wget -q "https://github.com/alphacep/vosk-api/releases/download/v${VOSK_LIB_VERSION}/vosk-linux-x86_64-${VOSK_LIB_VERSION}.zip" -O /tmp/libvosk.zip
          unzip -q /tmp/libvosk.zip -d /tmp/libvosk
          # Sudo benötigt, da wir auf dem GitHub Runner keine Root-Rechte haben
          sudo cp /tmp/libvosk/vosk-linux-x86_64-${VOSK_LIB_VERSION}/libvosk.so /usr/local/lib/
          sudo cp /tmp/libvosk/vosk-linux-x86_64-${VOSK_LIB_VERSION}/vosk_api.h /usr/local/include/
          sudo ldconfig

      - name: Build Linux binary
        run: go build -o omnipanel-go-linux-amd64 .

      - name: Package Linux ZIP
        run: |
          # zip ist auf ubuntu-latest vorinstalliert
          cp /usr/local/lib/libvosk.so .
          zip -r omnipanel-go-linux-amd64.zip omnipanel-go-linux-amd64 user config.json libvosk.so

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: omnipanel-go-linux-archive
          path: omnipanel-go-linux-amd64.zip

  build-windows:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Wine and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wine wine64 wine32 xvfb wget unzip zip
          sudo dpkg --add-architecture i386 || true

      - name: Initialize Wine environment
        run: |
          export WINEARCH=win64
          export WINEPREFIX=$HOME/.wine
          wineboot -i

      - name: Download Go for Windows
        run: |
          GOWIN_VERSION="1.26"
          wget -q "https://go.dev/dl/go${GOWIN_VERSION}.windows-amd64.zip" -O /tmp/go-windows.zip
          mkdir -p $HOME/.wine/drive_c/go-windows
          unzip -q /tmp/go-windows.zip -d $HOME/.wine/drive_c/go-windows

      - name: Download Vosk Windows SDK
        run: |
          VOSK_LIB_VERSION="0.3.45"
          wget -q "https://github.com/alphacep/vosk-api/releases/download/v${VOSK_LIB_VERSION}/vosk-win64-${VOSK_LIB_VERSION}.zip" -O /tmp/libvosk-win.zip
          mkdir -p $HOME/.wine/drive_c/vosk-win
          unzip -q /tmp/libvosk-win.zip -d /tmp/libvosk-win-tmp
          
          # Find and copy DLL and headers
          find /tmp/libvosk-win-tmp -name "*.dll" -type f -exec cp {} $HOME/.wine/drive_c/vosk-win/ \;
          find /tmp/libvosk-win-tmp -name "vosk_api.h" -type f -exec cp {} $HOME/.wine/drive_c/vosk-win/ \;
          
          # Verify files were copied
          ls -la $HOME/.wine/drive_c/vosk-win/ || echo "Warning: vosk-win directory may be empty"

      - name: Copy project to Wine drive
        run: |
          mkdir -p $HOME/.wine/drive_c/omnipanel
          cp -r ${{ github.workspace }}/* $HOME/.wine/drive_c/omnipanel/

      - name: Build Windows binary with Wine
        run: |
          export WINEARCH=win64
          export WINEPREFIX=$HOME/.wine
          xvfb-run -a wine cmd /c "cd C:\omnipanel && C:\go-windows\go\bin\go.exe build -v -o omnipanel-go-windows-amd64.exe ."

      - name: Verify binary was created
        run: |
          if [ -f "$HOME/.wine/drive_c/omnipanel/omnipanel-go-windows-amd64.exe" ]; then
            echo "✓ Binary created successfully"
            ls -lh "$HOME/.wine/drive_c/omnipanel/omnipanel-go-windows-amd64.exe"
          else
            echo "✗ Binary creation failed!"
            exit 1
          fi

      - name: Extract binary and DLL from Wine
        run: |
          cp "$HOME/.wine/drive_c/omnipanel/omnipanel-go-windows-amd64.exe" ./
          cp "$HOME/.wine/drive_c/vosk-win/libvosk.dll" ./ || cp "$HOME/.wine/drive_c/vosk-win/vosk.dll" ./libvosk.dll || echo "Warning: DLL not found"
          ls -lh *.exe *.dll 2>/dev/null || true

      - name: Package Windows ZIP
        run: |
          mkdir -p temp-package
          cp omnipanel-go-windows-amd64.exe temp-package/
          cp libvosk.dll temp-package/ 2>/dev/null || echo "Warning: libvosk.dll not found"
          cp user config.json temp-package/ 2>/dev/null || true
          cd temp-package && zip -r ../omnipanel-go-windows-amd64.zip . && cd ..

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: omnipanel-go-windows-archive
          path: omnipanel-go-windows-amd64.zip

  create-release:
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows]
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            artifacts/omnipanel-go-linux-archive/omnipanel-go-linux-amd64.zip
            artifacts/omnipanel-go-windows-archive/omnipanel-go-windows-amd64.zip