apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: omnipanel-go
spec:
  parentRefs:
    - name: default
      namespace: gateway-system
  hostnames:
    - omnipanel.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: omnipanel-go
          port: 80
